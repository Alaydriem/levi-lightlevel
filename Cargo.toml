[workspace]
resolver = "3"
members = ["levels/core", "levels/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
curia = "=0.2.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hcl-rs = "=0.19.8"
levels-core = { path = "levels/core" }
# mod manager crates; moves to a git dependency on a levi-crates tag before publishing
amm-abi = { path = "../levi-crates/crates/amm-abi" }
amm-client = { path = "../levi-crates/crates/amm-client", default-features = false }
amm-core = { path = "../levi-crates/crates/amm-core" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
