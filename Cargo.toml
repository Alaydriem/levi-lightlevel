[workspace]
resolver = "3"
members = ["levels/core", "levels/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
curia = "=0.2.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hcl-rs = "=0.19.8"
levels-core = { path = "levels/core" }
amm-abi = { git = "https://github.com/Alaydriem/levi-modmanager", tag = "v1.0.0" }
amm-client = { git = "https://github.com/Alaydriem/levi-modmanager", tag = "v1.0.0", default-features = false }
amm-core = { git = "https://github.com/Alaydriem/levi-modmanager", tag = "v1.0.0" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
