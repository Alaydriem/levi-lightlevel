language = "C"
cpp_compat = true
include_guard = "LEVI_LEVELS_H"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from levels/ffi. Do not edit: run `mise run header`. */"
documentation = true
style = "both"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = [
  "LvStatus",
  "LvStr",
  "LvFrameStatus",
  "LvColumnRequest",
  "LvScanView",
  "LvSurfaceSample",
  "LvLabel",
  "LvDrawView",
  "LvCamera",
]
